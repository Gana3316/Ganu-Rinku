<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:linear-gradient(135deg,#120008,#350016,#090009);
color:white;
font-family:Georgia,serif;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

.container{
padding:30px;
max-width:600px;
}

.small{
color:#ff8aaa;
font-family:Arial;
letter-spacing:4px;
font-size:12px;
margin-bottom:25px;
}

h1{
font-size:48px;
line-height:1.3;
margin-bottom:25px;
}

p{
font-size:19px;
line-height:1.9;
color:#f3dce4;
}

button{
margin-top:35px;
padding:15px 28px;
border:none;
border-radius:50px;
background:#ff3f78;
color:white;
font-size:16px;
cursor:pointer;
box-shadow:0 0 25px #ff3f78;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
color:#ff4d83;
animation:float 7s linear infinite;
bottom:-30px;
}

@keyframes float{

0%{
transform:translateY(0);
opacity:0;
}

20%{
opacity:.8;
}

100%{
transform:translateY(-110vh);
opacity:0;
}

}

</style>
</head>

<body>

<div class="container">

<div class="small">
A LITTLE SURPRISE
</div>

<h1>
तुझ्यासाठी काहीतरी खास आहे… ❤️
</h1>

<p>
ही फक्त एक website नाही…<br>
तुझ्यासाठी मनापासून तयार केलेली<br>
एक छोटीशी surprise आहे.
</p>

<button onclick="openSurprise()">
✨ Open Your Surprise ✨
</button>

</div>

<script>

function openSurprise(){

alert("थोडं थांब… ❤️ Surprise अजून बाकी आहे!");

}

for(let i=0;i<15;i++){

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="♥";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(12+Math.random()*25)+"px";
heart.style.animationDuration=(5+Math.random()*7)+"s";
heart.style.animationDelay=(-Math.random()*10)+"s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
